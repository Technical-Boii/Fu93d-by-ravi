name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Expo and NativeWind dependencies
        run: |
          pnpm add -D \
            babel-preset-expo@57.0.16 \
            @babel/plugin-transform-react-jsx@7.27.1 \
            --lockfile=false

          pnpm add \
            react-native-css-interop@0.2.1 \
            --lockfile=false

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo configuration
        run: pnpm exec expo config --type public

      - name: Generate Android project
        run: pnpm exec expo prebuild --non-interactive

      - name: Check Android project
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenixx-relay-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
